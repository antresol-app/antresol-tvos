name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-linux:
    name: AntresolKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: AntresolKit
        run: swift build
      - name: Test
        working-directory: AntresolKit
        run: swift test

  app-tvos:
    name: AntresolTV (tvOS Simulator)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          if ! xcodebuild -project Antresol.xcodeproj -scheme AntresolTV \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath build \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1; then
            grep -E 'error:' xcodebuild.log | sort -u | head -n 150
            tail -n 40 xcodebuild.log
            exit 1
          fi
          grep -E '(AntresolTV|TopShelf|Shared)/.*warning:' xcodebuild.log | sort -u | head -n 100 || true
          tail -n 5 xcodebuild.log
          # The Top Shelf extension must be embedded in the app.
          test -d build/Build/Products/Debug-appletvsimulator/AntresolTV.app/PlugIns/TopShelf.appex
          plutil -p build/Build/Products/Debug-appletvsimulator/AntresolTV.app/PlugIns/TopShelf.appex/Info.plist | grep -E 'NSExtensionPointIdentifier|AntresolKeychainGroup'

  archive-tvos:
    name: Release archive (tvOS device)
    runs-on: xcode-27
    env:
      # The build number the archive is stamped with (CURRENT_PROJECT_VERSION).
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check App Store metadata
        run: python3 scripts/check-metadata.py
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive
        run: |
          if ! xcodebuild archive -project Antresol.xcodeproj -scheme AntresolTV \
            -destination 'generic/platform=tvOS' -archivePath build/Antresol.xcarchive \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > archive.log 2>&1; then
            grep -E 'error:' archive.log | sort -u | head -n 150
            tail -n 40 archive.log
            exit 1
          fi
          grep -E '(AntresolTV|TopShelf|Shared)/.*warning:' archive.log | sort -u | head -n 100 || true
          tail -n 3 archive.log
      - name: Verify the archive
        run: |
          # The expected version is project.yml's MARKETING_VERSION; the build number is
          # the one the archive step passed as CURRENT_PROJECT_VERSION.
          VERSION=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' project.yml | head -n 1)
          test -n "$VERSION" || { echo "::error::MARKETING_VERSION not found in project.yml"; exit 1; }
          expect() {
            local actual
            actual=$(plutil -extract "$2" raw "$1/Info.plist")
            if [ "$actual" != "$3" ]; then
              echo "::error::$(basename "$1") $2 is '$actual', expected '$3'"
              return 1
            fi
          }
          APP=build/Antresol.xcarchive/Products/Applications/AntresolTV.app
          EXT=$APP/PlugIns/TopShelf.appex
          for BUNDLE in "$APP" "$EXT"; do
            plutil -lint "$BUNDLE/PrivacyInfo.xcprivacy"
            expect "$BUNDLE" CFBundleShortVersionString "$VERSION"
            expect "$BUNDLE" CFBundleVersion "$BUILD_NUMBER"
            lipo -info "$BUNDLE/$(plutil -extract CFBundleExecutable raw "$BUNDLE/Info.plist")"
          done
          expect "$APP" ITSAppUsesNonExemptEncryption false
          echo "AntresolTV $VERSION ($BUILD_NUMBER) archived with the Top Shelf extension"

  ui-screenshots:
    name: UI screenshots (tvOS Simulator)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Start mock server
        run: |
          nohup python3 scripts/mock-server.py --port 8421 > mock-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8421/api/health
      - name: Pick an Apple TV simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          tv = [d for runtime, items in devices.items() if "tvOS" in runtime for d in items]
          tv.sort(key=lambda d: "4K" not in d["name"])
          print(tv[0]["udid"])')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Boot the simulator
        # A cold simulator sometimes hangs while booting: erase it and try once more.
        run: |
          boot() {
            xcrun simctl boot "$SIM_UDID" || true
            perl -e 'alarm shift; exec @ARGV' 420 xcrun simctl bootstatus "$SIM_UDID" -b
          }
          if ! boot; then
            echo "::warning::Simulator boot failed; erasing it and retrying once"
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl erase "$SIM_UDID"
            boot
          fi
          # A run that failed or was cancelled before it could put the setting back
          # (the Reduce Motion step below) must not decide what this one sees.
          xcrun simctl spawn "$SIM_UDID" defaults delete com.apple.Accessibility ReduceMotionEnabled || true
      - name: Run UI tests
        id: uitests
        # The hero test fails if Reduce Motion is on here: with it on it would pass the
        # other way, and every screenshot would be taken with the setting on.
        run: |
          if ! TEST_RUNNER_ANTRESOL_EXPECT_REDUCE_MOTION=0 xcodebuild test -project Antresol.xcodeproj -scheme AntresolTV \
            -destination "id=$SIM_UDID" -resultBundlePath ui.xcresult > uitest.log 2>&1; then
            grep -E 'error:|failed|Test Case' uitest.log | head -n 80
            tail -n 40 uitest.log
            exit 1
          fi
          grep -E 'Test Case|Executed' uitest.log | tail -n 10
      - name: Run the hero test with Reduce Motion on
        # The run above sees the setting off (the hero moves on by itself); with it on
        # the hero must stay. One test, about two minutes, on the build made above.
        id: reducemotion
        run: |
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          if ! TEST_RUNNER_ANTRESOL_EXPECT_REDUCE_MOTION=1 xcodebuild test-without-building \
            -project Antresol.xcodeproj -scheme AntresolTV -destination "id=$SIM_UDID" \
            -only-testing:AntresolTVUITests/RuntimeTests/testHeroAutoAdvance \
            -resultBundlePath reduce-motion.xcresult > reduce-motion.log 2>&1; then
            grep -E 'error:|failed|Test Case' reduce-motion.log | head -n 40
            tail -n 40 reduce-motion.log
            exit 1
          fi
          grep -E 'Test Case|Executed' reduce-motion.log | tail -n 4
          # A test that was renamed is not run at all, and that is not a failure.
          if ! grep -Eq 'Executed 1 test, with 0 failures' reduce-motion.log; then
            echo "::error::The Reduce Motion run did not run exactly one test"
            exit 1
          fi
      - name: Put Reduce Motion back
        # Also after a failure or a cancelled job: the simulator may be used again.
        if: ${{ always() }}
        run: xcrun simctl spawn "$SIM_UDID" defaults delete com.apple.Accessibility ReduceMotionEnabled || true
      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path ui.xcresult --output-path screenshots
          if [ -d reduce-motion.xcresult ]; then
            mkdir -p screenshots/reduce-motion
            xcrun xcresulttool export attachments --path reduce-motion.xcresult --output-path screenshots/reduce-motion
          fi
          cp mock-server.log screenshots/
          ls screenshots
          echo "Top Shelf extension requests:"
          grep 'TopShelf' mock-server.log | tail -n 20 || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-screenshots
          path: screenshots
      - name: Publish to the screenshots branch
        # One commit, force-pushed: the branch always holds the latest set from main.
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build-gallery.py screenshots gallery "$GITHUB_SHA" \
            "${{ steps.uitests.outcome == 'success' && steps.reducemotion.outcome == 'success' && 'success' || 'failure' }}"
          cd gallery
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI screenshots for ${GITHUB_SHA::7}"
          git push --force -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
